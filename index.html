	<head>

		<meta name="viewport" content="width=device-width, initial-scale=1">

		<meta name="description" content="Smart Panel.">

		<meta name="theme-color" content="#fff">

							<span id="temperature" title="Inside"></span> <span><span id="weather" class="ms-4" title="Outside"></span> <span id="weather-icon"></span></span>

					</div>
				</div>
			</div>
		</div>
