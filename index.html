<!DOCTYPE html>
<html lang="en-US">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Smart Panel</title>
		<meta name="description" content="Smart Panel.">
		<meta name="author" content="Adam777">
		<meta name="theme-color" content="#fff">
		<link rel="icon" type="image/png" href="./assets/images/icon.png">
		<meta property="og:image" content="./assets/images/icon.png">

		<link rel="stylesheet" href="./assets/css/bootstrap.min.css">
		<link rel="stylesheet" href="./assets/css/bootstrap-icons.min.css">
		<link rel="stylesheet" href="./assets/css/style.min.css">

		<script src="./assets/js/bootstrap.bundle.min.js"></script>
		<script src="./config.js"></script>
		<script src="./assets/js/script.min.js"></script>
	</head>
	<body>
		<div class="container vh-100 d-flex justify-content-center align-items-center">
			<div class="row">
				<div class="col">
					<div id="time"></div>
					<div class="d-flex justify-content-center align-items-baseline">
						<span id="date"></span> <span id="day" class="ms-4"></span>
					</div>
					<div class="d-flex justify-content-between align-items-end">
						<div class="d-flex justify-content-center align-items-baseline">
							<span id="temperature" title="Inside"></span> <span><span id="weather" class="ms-4" title="Outside"></span> <span id="weather-icon"></span></span>
						</div>
						<div class="btn-group dropstart ac-control-container">
							<button type="button" id="ac-control" data-bs-toggle="dropdown" aria-expanded="false"><i class="bi bi-thermometer-half"></i></button>
							<ul class="dropdown-menu dropdown-menu-dark">
								<li><a class="dropdown-item" href="#" data-mode="cool" data-temperature="20" data-fan="auto">Cool 20 °C</a></li>
								<li><a class="dropdown-item" href="#" data-mode="cool" data-temperature="22" data-fan="auto">Cool 22 °C</a></li>
								<li><a class="dropdown-item" href="#" data-mode="cool" data-temperature="24" data-fan="auto">Cool 24 °C</a></li>
								<li><a class="dropdown-item" href="#" data-mode="cool" data-temperature="25" data-fan="auto">Cool 25 °C</a></li>
								<li><a class="dropdown-item" href="#" data-mode="cool" data-temperature="26" data-fan="auto">Cool 26 °C</a></li>
								<li><a class="dropdown-item" href="#" data-mode="cool" data-temperature="27" data-fan="auto">Cool 27 °C</a></li>
								<li><a class="dropdown-item" href="#" data-mode="cool" data-temperature="28" data-fan="auto">Cool 28 °C</a></li>
								<li><hr class="dropdown-divider"></li>
								<li><a class="dropdown-item" href="#" data-mode="heat" data-temperature="22" data-fan="auto">Heat 22 °C</a></li>
								<li><a class="dropdown-item" href="#" data-mode="heat" data-temperature="24" data-fan="auto">Heat 24 °C</a></li>
								<li><a class="dropdown-item" href="#" data-mode="heat" data-temperature="25" data-fan="auto">Heat 25 °C</a></li>
								<li><a class="dropdown-item" href="#" data-mode="heat" data-temperature="26" data-fan="auto">Heat 26 °C</a></li>
								<li><a class="dropdown-item" href="#" data-mode="heat" data-temperature="28" data-fan="auto">Heat 28 °C</a></li>
								<li><a class="dropdown-item" href="#" data-mode="heat" data-temperature="30" data-fan="auto">Heat 30 °C</a></li>
								<li><hr class="dropdown-divider"></li>
								<li><a class="dropdown-item" href="#" data-mode="auto" data-temperature="25" data-fan="auto">Auto 25 °C</a></li>
								<li><a class="dropdown-item" href="#" data-mode="fan" data-fan="auto">Fan Auto</a></li>
								<li><a class="dropdown-item" href="#" data-mode="fan" data-fan="low">Fan Low</a></li>
								<li><a class="dropdown-item" href="#" data-mode="dry" data-fan="auto">Dry</a></li>
								<li><a class="dropdown-item" href="#" data-mode="off" data-delay="60">Off after 1 hour</a></li>
								<li><a class="dropdown-item" href="#" data-mode="off" data-delay="30">Off after 30 minutes</a></li>
								<li><a class="dropdown-item" href="#" data-mode="off" data-delay="0">Off</a></li>
							</ul>
						</div>
						<button type="button" id="light-toggle"><i class="bi bi-lightbulb"></i></button>
					</div>
				</div>
			</div>
		</div>
	</body>
</html>
